<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konditori Mill</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Julius+Sans+One&family=Lora:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Story+Script&display=swap" rel="stylesheet"> <!--Meny-font-->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Italianno&family=Julius+Sans+One&family=Lora:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Story+Script&display=swap" rel="stylesheet"> <!--Rubriker-->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Instrument+Serif:ital@0;1&family=Italianno&family=Julius+Sans+One&family=Lora:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Story+Script&display=swap" rel="stylesheet"> <!--Brödtext-->
</head>
<body>
    <header>
        <div id="menu-small-screen">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" id="menuIcon">&#9776;</label>
            <ul id="menu">
                <li><a href="index.html">Startsida</a></li>
                <li><a href="index.html#employees">Våra anställda</a></li>
                <li><a href="contact.html">Kontakta oss</a></li>
            </ul>
        </div>
        <div id="menu-large-screen">
            <div class="item1">
                <a href="index.html"><img src="pictures/logo.png" alt="Logotyp"></a> 
            </div>
            <div class="item2">
                <a href="index.html#employees">Våra anställda</a>
            </div>
            <div class="item3">
                <a href="contact.html">Kontakta oss</a>
            </div>
        </div>
    </header>
    <section id="contact">
        <h1>Kontakta oss</h1>
        <form action="contact.html" method="post">
            <label for="name">* Ditt namn:</label>
            <input type="text" id="name" name="name">
            <p class="visibility-hidden" id="nameError">Namnet är ogiltigt</p>

            <label for="tel">* Ditt telefonnummer:</label>
            <input type="tel" id="tel" name="tel">
            <p class="visibility-hidden" id="telError">Telefonnumret är ogiltigt</p>

            <label for="email">* Din e-postadress:</label>
            <input type="email" id="email" name="email">
            <p class="visibility-hidden" id="emailError">E-postadress är ogiltig</p>

            <label for="message">* Vad kan vi hjälpa dig med?</label>
            <textarea name="message" id="message"></textarea>
            <p class="visibility-hidden" id="messageError">Ditt meddelande får inte överskrida 500 ord</p>

            <p>* Obligatoriska fält</p>
            <button type="reset" id="sendButton">Skicka</button>
            <p id="thankyou-message" class="visibility-hidden">Tack för ditt meddelande!</p>
        </form>
    </section>
    <footer>
        <img src="pictures/logo_text.png" alt="Logotyp med text">
    </footer>
</body>
</html>
