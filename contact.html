<body>
    <header>
        <div class="item1">
            <a href="index.html"><img src="pictures/logo.png" alt="Logotyp"></a>

        </div>
        <div class="item3">
            <a href="contact.html">Kontakta oss</a>
        </div>
    </header>
    <section id="contact">
        <h1>Kontakta oss</h1>
        <form>
            <div>
                <label for="name">Ditt namn:</label>
                <input type="text" id="name" name="name" value="">
                <label for="tel">Ditt telefonnummer:</label>
                <input type="tel" id="tel" name="tel">
                <label for="email">Din e-postadress:</label>
                <input type="email" id="email" name="email">
                <label for="message">Vad kan vi hjälpa dig med?</label>
                <textarea name="message" id="message"></textarea>
                <button>Skicka</button>
            </div>
        </form>
    </section>
    <footer>
        <img src="pictures/logo_text.png" alt="Logotyp med text">
    </footer>
